<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 460" width="100%" height="100%" style="background-color: #ffffff;">

  <!-- ============================================================== -->
  <!-- TABELLA 1: Water saving results                                -->
  <!-- ============================================================== -->
  <g id="water-saving-table" transform="translate(45, 15)">
    <!-- Titolo / Didascalia -->
    <text x="225" y="16" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13px" font-style="italic" fill="#111827">
      Water saving results
    </text>

    <!-- Linee Booktabs -->
    <line x1="0" y1="26" x2="450" y2="26" stroke="#111827" stroke-width="1.3" />
    <line x1="165" y1="52" x2="435" y2="52" stroke="#111827" stroke-width="0.7" /> <!-- cmidrule under water -->
    <line x1="0" y1="76" x2="450" y2="76" stroke="#111827" stroke-width="0.7" />
    <line x1="0" y1="102" x2="450" y2="102" stroke="#111827" stroke-width="0.4" />
    <line x1="0" y1="152" x2="450" y2="152" stroke="#111827" stroke-width="1.3" />

    <!-- Intestazioni Colonne -->
    <text x="25" y="60" text-anchor="start" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">Field</text>
    <text x="115" y="60" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">Year</text>
    
    <!-- Multicolumn: water (down arrow) -->
    <text x="300" y="46" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-style="italic" fill="#111827">water &#8595;</text>
    <text x="205" y="68" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">Farmer</text>
    <text x="300" y="68" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">SMARTER</text>
    <text x="395" y="68" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">Saving</text>

    <!-- Dati: Ancarani -->
    <text x="25" y="93" text-anchor="start" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">Ancarani</text>
    <text x="115" y="93" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">2024</text>
    <text x="205" y="93" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">410</text>
    <text x="300" y="93" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">339</text>
    <text x="395" y="93" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">-17.32%</text>

    <!-- Dati: Errano -->
    <text x="25" y="125" text-anchor="start" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">Errano</text>
    <text x="115" y="117" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">2023</text>
    <text x="205" y="117" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">883</text>
    <text x="300" y="117" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">522</text>
    <text x="395" y="117" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">-40.88%</text>

    <text x="115" y="141" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">2024</text>
    <text x="205" y="141" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">787</text>
    <text x="300" y="141" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" font-weight="bold" fill="#111827">670</text>
    <text x="395" y="141" text-anchor="middle" font-family="'Times New Roman', serif" font-size="11.5px" fill="#111827">-14.87%</text>
